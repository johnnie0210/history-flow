<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7a2e2a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="한국사 흐름" />
<title>한국사 흐름</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-title">
      <span class="logo" aria-hidden="true">史</span>
      <div>
        <h1>한국사 흐름</h1>
        <p id="topbar-sub">불러오는 중…</p>
      </div>
    </div>
    <button id="btn-info" class="icon-btn" aria-label="정보">⋯</button>
  </header>

  <main id="views">

    <!-- 카드 -->
    <section class="view" id="view-card">
      <div class="seg" id="card-kind-seg">
        <button class="seg-btn active" data-kind="next">흐름</button>
        <button class="seg-btn" data-kind="pair">짝</button>
        <button class="seg-btn" data-kind="topic">주제</button>
        <button class="seg-btn" data-kind="all">전체</button>
      </div>
      <div class="rangebar">
        <label for="card-range">범위</label>
        <select id="card-range"></select>
      </div>
      <div class="deckbar">
        <span id="card-progress-text">0 / 0</span>
        <label class="switch"><input type="checkbox" id="card-shuffle" /><span>섞기</span></label>
        <label class="switch"><input type="checkbox" id="card-hide-known" /><span>외운 것 숨기기</span></label>
      </div>

      <div class="card-stage">
        <div class="flip-card" id="flip-card" role="button" tabindex="0" aria-label="카드 뒤집기">
          <div class="flip-face flip-front" id="card-front"></div>
          <div class="flip-face flip-back" id="card-back"></div>
        </div>
      </div>
      <div class="card-progress-bar"><div id="card-progress-fill"></div></div>

      <div class="card-controls">
        <button class="ctrl" id="btn-prev" aria-label="이전">◀</button>
        <button class="ctrl primary" id="btn-flip">뒤집기</button>
        <button class="ctrl" id="btn-next" aria-label="다음">▶</button>
      </div>
      <div class="card-meta">
        <button class="known-btn" id="btn-known">☆ 외웠어요</button>
        <span id="card-known-count"></span>
      </div>
    </section>

    <!-- 퀴즈 -->
    <section class="view hidden" id="view-quiz">
      <div id="quiz-setup">
        <p class="field-label">문제 유형</p>
        <div class="seg wrap" id="quiz-type-seg">
          <button class="seg-btn active" data-qtype="mix">섞어서</button>
          <button class="seg-btn" data-qtype="next">다음 사건</button>
          <button class="seg-btn" data-qtype="blank">빈칸</button>
          <button class="seg-btn" data-qtype="order">순서 맞추기</button>
          <button class="seg-btn" data-qtype="detail">설명 보고 고르기</button>
          <button class="seg-btn" data-qtype="pair">짝 맞추기</button>
        </div>
        <div class="rangebar">
          <label for="quiz-range">범위</label>
          <select id="quiz-range"></select>
        </div>
        <p class="field-label">문제 수</p>
        <div class="seg" id="quiz-count-seg">
          <button class="seg-btn active" data-count="10">10</button>
          <button class="seg-btn" data-count="20">20</button>
          <button class="seg-btn" data-count="50">50</button>
          <button class="seg-btn" data-count="0">전체</button>
        </div>
        <p class="field-label">출제 순서</p>
        <div class="seg" id="quiz-order-seg">
          <button class="seg-btn active" data-order="random">무작위</button>
          <button class="seg-btn" data-order="weak">자주 틀린 것</button>
        </div>
        <button class="big-btn" id="btn-start-quiz">퀴즈 시작</button>
        <p class="quiz-info" id="quiz-info"></p>
      </div>

      <div id="quiz-play" class="hidden">
        <div class="quiz-top">
          <span id="quiz-counter">1 / 10</span>
          <button class="link-btn" id="btn-quiz-quit">그만하기</button>
          <span id="quiz-score">0점</span>
        </div>
        <div class="quiz-progress"><div id="quiz-progress-fill"></div></div>
        <div class="quiz-q">
          <span class="chip" id="quiz-topic"></span>
          <p class="quiz-prompt" id="quiz-prompt"></p>
          <div class="quiz-question" id="quiz-question"></div>
          <p class="quiz-context" id="quiz-context"></p>
        </div>
        <div class="order-picked hidden" id="order-picked"></div>
        <div class="quiz-options" id="quiz-options"></div>
        <div class="quiz-explain hidden" id="quiz-explain"></div>
        <button class="big-btn" id="btn-quiz-next" disabled>다음</button>
      </div>

      <div id="quiz-result" class="hidden">
        <div class="result-emoji" id="result-emoji"></div>
        <h2 class="result-title" id="result-title"></h2>
        <p class="result-score" id="result-score"></p>
        <div class="result-wrong" id="result-wrong"></div>
        <button class="big-btn" id="btn-quiz-again">다시 풀기</button>
        <button class="ghost-btn" id="btn-review-wrong">틀린 것만 다시</button>
      </div>
    </section>

    <!-- 흐름 보기 -->
    <section class="view hidden" id="view-list">
      <div class="searchbar"><input type="search" id="list-search" placeholder="사건 · 인물 · 주제 검색" /></div>
      <div class="seg wrap" id="list-era-seg"></div>
      <div class="list-count" id="list-count"></div>
      <div id="list-body"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="card"><span class="tab-ic">📇</span>카드</button>
    <button class="tab" data-tab="quiz"><span class="tab-ic">❓</span>퀴즈</button>
    <button class="tab" data-tab="list"><span class="tab-ic">📜</span>흐름 보기</button>
  </nav>
</div>

<div class="sheet-backdrop hidden" id="sheet-backdrop">
  <div class="sheet" role="dialog" aria-label="정보">
    <div class="sheet-handle"></div>
    <h2>정보</h2>
    <ul class="info-list">
      <li><span>주제</span><b id="info-topics">—</b></li>
      <li><span>카드</span><b id="info-cards">—</b></li>
      <li><span>문제</span><b id="info-questions">—</b></li>
    </ul>
    <h3>학습 기록</h3>
    <div class="stat-grid">
      <div class="stat"><div class="stat-num" id="stat-known">0</div><div class="stat-lbl">외운 카드</div></div>
      <div class="stat"><div class="stat-num" id="stat-quiz">0</div><div class="stat-lbl">푼 문제</div></div>
      <div class="stat"><div class="stat-num" id="stat-acc">0%</div><div class="stat-lbl">정답률</div></div>
    </div>
    <div id="stat-era"></div>
    <button class="ghost-btn danger" id="btn-reset">학습 기록 초기화</button>
    <p class="sheet-note">기록은 이 기기에만 저장됩니다. 내용은 저장소의 content.md를 고치면 바뀝니다.</p>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
